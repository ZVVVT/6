[Software]
name = 人类精子蛋白质量分析软件
version = 1.0.0
company = 公司名称

[MvImageID]
run_mode = source
source_project_dir = F:\MvImageID
module_name = MvImageID
head_pipeline = pipelines\pipeline_head.cppipe
tail_pipeline = pipelines\pipeline_tail.cppipe
qc_pipeline = pipelines\pipeline_qc.cppipe
plugins_directory = F:\MvImageID\C-plugins\active_plugins
python_exe = F:\MvImageID\.venv\Scripts\python.exe

[AnalysisV2]
enabled = false
workspace_subdir = analysis_v2
head_segmentation_backend = direct_cellpose
head_segmentation_worker = tools\analysis_v2\direct_cellpose_worker.py
head_segmentation_timeout_seconds = 120
head_segmentation_model = cpsam

[Workspace]
root_dir = workspace\cases
database = data\analysis.db
report_dir = reports

[ImageRule]
r_suffix = _TRITC
g_suffix = _FITC
dic_suffix = _DIC
merge_suffix = _Merge
image_ext = .png

[Protein]
protein1 = head
protein2 = head
protein3 = tail
protein4 = head
protein5 = head

[ProteinOrder]
keys = protein1,protein2,protein3,protein4,protein5

[ProteinNames]
protein1 = Q9BYW3
protein2 = P10323
protein3 = Q96P56
protein4 = Q8IYV9
protein5 = W5XKT8

[ProteinPipelines]
protein1 = pipelines\pipeline_head.cppipe
protein2 = pipelines\pipeline_head.cppipe
protein3 = pipelines\pipeline_tail.cppipe
protein4 = pipelines\pipeline_head.cppipe
protein5 = pipelines\pipeline_head.cppipe

[ProteinReferenceIntensityMin]
protein1 = 26.0
protein2 = 26.0
protein3 = 26.0
protein4 = 26.0
protein5 = 26.0

[ProteinReferenceRateMin]
protein1 = 82.88
protein2 = 82.88
protein3 = 82.88
protein4 = 82.88
protein5 = 82.88

[ResultAdjustment]
enabled = true
use_case_tail_rate_for_head_intensity = false
default_tail_rate_ratio = 1.0
fluorescence_result_factor = 1.0
expression_rate_result_factor = 1.0
sync_positive_count_with_expression_rate = false
display_decimals = 1

[Report]
logo_path = assets\logo.png

[BatchFolderAliases]
protein1 = Q9BYW3,HEL-1,A,蛋白1,protein1,protein1_Q9BYW3
protein2 = P10323,HEL-2,B,蛋白2,protein2,protein2_P10323
protein3 = Q96P56,HEL-3,C,蛋白3,protein3,protein3_Q96P56
protein4 = Q8IYV9,HEL-4,D,蛋白4,protein4,protein4_Q8IYV9
protein5 = W5XKT8,HEL-5,E,蛋白5,protein5,protein5_W5XKT8

[AppInfo]
app_name = 人类精子蛋白质量分析软件
logo_path = assets\custom_app_logo.png
font_path = 
font_size = 10

[QC]
root_dir = workspace\qc
output_dir = 

