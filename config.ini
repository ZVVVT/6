report_dir = reports

[ImageRule]
r_suffix = _R
g_suffix = _G
dic_suffix = _DIC
merge_suffix = _Merge
image_ext = .tif

[Protein]
protein1 = head
protein2 = head
protein3 = tail
protein4 = head
protein5 = head
pna = pna

[Report]
logo_path = assets\logo.png