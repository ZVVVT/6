[Software]
name = 人精子蛋白质量分析软件
version = 1.0.0
company = 公司名称

[CellProfiler]
run_mode = source
powershell_exe = powershell.exe

source_project_dir = F:\MvImageID
venv_activate = F:\MvImageID\.venv\Scripts\Activate.ps1
module_name = MvImageID

head_pipeline = F:\MvImageID\pipelines4_DLM\DLM\CPP.cppipe
tail_pipeline = F:\MvImageID\pipelines4_DLM\DLM\CPP.cppipe
pna_pipeline = F:\MvImageID\pipelines4_DLM\DLM\CPP.cppipe

plugins_directory = F:\MvImageID\C-plugins\active_plugins
log_file = F:\MvImageID\run.log

[Workspace]
root_dir = workspace\cases
database = data\analysis.db
report_dir = reports

[ImageRule]
r_suffix = _R
g_suffix = _G
dic_suffix = _DIC
merge_suffix = _Merge
image_ext = .tif

[Protein]
protein1 = head
protein2 = head
protein3 = tail
protein4 = head
protein5 = head
pna = pna

[Report]
logo_path = assets\logo.png