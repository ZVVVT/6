[Software]
name = 人精子蛋白质量分析软件
version = 1.0.0
company = 公司名称

[CellProfiler]
cellprofiler_exe = D:\CellProfiler\CellProfiler.exe
head_pipeline = pipelines\head_detect.cppipe
tail_pipeline = pipelines\tail_detect.cppipe
pna_pipeline = pipelines\pna_detect.cppipe

[Workspace]
